<svg xmlns="http://www.w3.org/2000/svg" width="400" height="404" viewBox="0 0 400 404" role="img" aria-labelledby="title desc">
  <title id="title">duroey — Selected Repositories and Systems</title>
  <desc id="desc">Mobile Apple-style bento grid showcasing MyType, dsh-study-tree, Quantitative Research Workbench, and Second Brain.</desc>
  <defs>
    <linearGradient id="spark-m-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes pulseBar { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes nodeGlow { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      .b1 { animation: pulseBar 3.2s ease-in-out infinite 0s; }
      .b2 { animation: pulseBar 3.2s ease-in-out infinite 0.4s; }
      .b3 { animation: pulseBar 3.2s ease-in-out infinite 0.8s; }
      .b4 { animation: pulseBar 3.2s ease-in-out infinite 1.2s; }
      .ng { animation: nodeGlow 3.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .b1,.b2,.b3,.b4,.ng { animation: none; } }
    </style>
  </defs>

  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <!-- Row 1: MyType -->
    <rect x="1" y="1" width="398" height="148" rx="18" fill="#f5f5f7" stroke="#e5e5ea"/>
    <text x="20" y="30" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#0071e3">SWIFT · MACOS</text>
    <text x="20" y="58" font-size="23" font-weight="700" letter-spacing="-0.5" fill="#1d1d1f">MyType</text>
    <text x="20" y="82" font-size="12.5" fill="#6e6e73">
      <tspan x="20" dy="0">Voice-first desktop Agent control plane.</tspan>
      <tspan x="20" dy="17">Search, intent routing &amp; shared Inbox.</tspan>
    </text>
    <rect x="20" y="114" width="166" height="18" rx="9" fill="#ffffff" stroke="#e5e5ea"/>
    <text x="103" y="127" text-anchor="middle" font-size="10" font-weight="500" fill="#424245">Codex &amp; Claude Handoff</text>
    <g stroke="#0071e3" stroke-width="3" stroke-linecap="round">
      <line class="b1" x1="306" y1="68" x2="306" y2="80"/>
      <line class="b2" x1="316" y1="58" x2="316" y2="90"/>
      <line class="b3" x1="326" y1="48" x2="326" y2="100"/>
      <line class="b4" x1="336" y1="54" x2="336" y2="94"/>
      <line class="b2" x1="346" y1="44" x2="346" y2="104"/>
      <line class="b3" x1="356" y1="58" x2="356" y2="90"/>
      <line class="b1" x1="366" y1="68" x2="366" y2="80"/>
    </g>

    <!-- Row 2: dsh-study-tree -->
    <rect x="1" y="161" width="398" height="106" rx="18" fill="#f5f5f7" stroke="#e5e5ea"/>
    <text x="20" y="188" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#6e6e73">TYPESCRIPT · PLUGIN v0.1.6</text>
    <text x="20" y="214" font-size="20" font-weight="700" letter-spacing="-0.4" fill="#1d1d1f">dsh-study-tree</text>
    <text x="20" y="237" font-size="12" fill="#6e6e73">Branching session navigator for DSH.</text>
    <g fill="none" stroke="#c7c7cc" stroke-width="1.6" stroke-linecap="round">
      <path d="M294 214 C312 214, 314 192, 334 192"/>
      <path d="M294 214 C312 214, 314 236, 334 236"/>
      <path d="M334 192 L368 184" stroke="#0071e3" stroke-width="1.8"/>
      <path d="M334 192 L368 206"/>
      <path d="M334 236 L368 236"/>
    </g>
    <circle cx="294" cy="214" r="4" fill="#ffffff" stroke="#8e8e93" stroke-width="1.8"/>
    <circle cx="334" cy="192" r="4" fill="#ffffff" stroke="#0071e3" stroke-width="1.8"/>
    <circle cx="334" cy="236" r="4" fill="#ffffff" stroke="#8e8e93" stroke-width="1.8"/>
    <circle class="ng" cx="368" cy="184" r="4.5" fill="#0071e3"/>
    <circle cx="368" cy="206" r="3.8" fill="#ffffff" stroke="#aeaeb2" stroke-width="1.6"/>
    <circle cx="368" cy="236" r="3.8" fill="#ffffff" stroke="#aeaeb2" stroke-width="1.6"/>

    <!-- Row 3 Left: Quant -->
    <rect x="1" y="279" width="193" height="124" rx="18" fill="#f5f5f7" stroke="#e5e5ea"/>
    <text x="16" y="303" font-size="10" font-weight="600" letter-spacing="0.6" fill="#6e6e73">PYTHON · NOTE</text>
    <text x="16" y="325" font-size="15.5" font-weight="700" fill="#1d1d1f">Quant Workbench</text>
    <text x="16" y="343" font-size="11" fill="#6e6e73">210 ranks · 98 reports</text>
    <path d="M16 388 L16 378 L46 381 L74 371 L104 374 L132 363 L176 355 L176 388 Z" fill="url(#spark-m-light)"/>
    <path d="M16 378 L46 381 L74 371 L104 374 L132 363 L176 355" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round"/>
    <circle class="ng" cx="176" cy="355" r="3" fill="#0071e3"/>

    <!-- Row 3 Right: Second Brain -->
    <rect x="206" y="279" width="193" height="124" rx="18" fill="#f5f5f7" stroke="#e5e5ea"/>
    <text x="221" y="303" font-size="10" font-weight="600" letter-spacing="0.6" fill="#6e6e73">SQLITE · PROTOTYPE</text>
    <text x="221" y="325" font-size="15.5" font-weight="700" fill="#1d1d1f">Second Brain</text>
    <text x="221" y="343" font-size="11" fill="#6e6e73">Session memory compiler</text>
    <g stroke="#c7c7cc" stroke-width="1.4">
      <line x1="234" y1="381" x2="274" y2="363"/>
      <line x1="274" y1="363" x2="312" y2="379" stroke="#0071e3" stroke-width="1.6"/>
      <line x1="312" y1="379" x2="352" y2="358" stroke="#0071e3" stroke-width="1.6"/>
      <line x1="352" y1="358" x2="378" y2="380"/>
    </g>
    <circle cx="234" cy="381" r="3.5" fill="#ffffff" stroke="#8e8e93" stroke-width="1.6"/>
    <circle cx="274" cy="363" r="4" fill="#ffffff" stroke="#0071e3" stroke-width="1.6"/>
    <circle class="ng" cx="312" cy="379" r="4.5" fill="#0071e3"/>
    <circle cx="352" cy="358" r="4" fill="#ffffff" stroke="#0071e3" stroke-width="1.6"/>
    <circle cx="378" cy="380" r="3.5" fill="#ffffff" stroke="#8e8e93" stroke-width="1.6"/>
  </g>
</svg>
